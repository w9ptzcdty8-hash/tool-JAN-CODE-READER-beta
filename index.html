<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JANコードリーダー（Web版）</title>
    <link rel="stylesheet" href="style.css">
    <!-- QuaggaJS (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
</head>
<body>

    <main id="app">
        <header class="header">
            <h1>JANコードリーダー</h1>
        </header>

        <!-- スキャナー表示領域 -->
        <div class="scanner-container">
            <div id="interactive" class="viewport">
                <!-- QuaggaJSが内部に<video>を自動生成します -->
            </div>
            <!-- ガイド枠 -->
            <div class="scanner-guide" id="scanner-guide"></div>
        </div>

        <!-- 読み取り結果・ステータス -->
        <div class="result-container">
            <p id="status-text" class="status-text">スキャン中…</p>
            <p id="jan-code-display" class="jan-code-display">- - - - - - - - - - - - -</p>
        </div>

        <!-- 検索アクションボタン -->
        <div class="button-group">
            <button id="btn-amazon" class="btn btn-amazon" disabled>Amazonで検索</button>
            <button id="btn-rakuten" class="btn btn-rakuten" disabled>楽天で検索</button>
        </div>
    </main>

    <!-- 固定広告枠 -->
    <div class="ad-banner">
        <div style="max-width: 100%;">
            <!-- admax -->
            <script src="https://adm.shinobi.jp/s/8a495d941206bf0c34aff9559f8d2cea"></script>
            <!-- admax -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
